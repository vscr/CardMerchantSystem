# CardMerchantSystem/docker-compose.yml

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════
  # POSTGRESQL
  # ═══════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: cardmerchant-postgres
    environment:
      POSTGRES_DB: cardmerchantdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cardmerchant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════
  # PGADMIN (PostgreSQL Management)
  # ═══════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cardmerchant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cardmerchant.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cardmerchant-network

  # ═══════════════════════════════════════════════════════
  # ELASTICSEARCH
  # ═══════════════════════════════════════════════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cardmerchant-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=cardmerchant-cluster
      - node.name=cardmerchant-node-1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - cardmerchant-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════════════════
  # KIBANA
  # ═══════════════════════════════════════════════════════
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: cardmerchant-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=cardmerchant-kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - cardmerchant-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      
  # ═══════════════════════════════════════════════════════
  # REDIS
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: cardmerchant-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - cardmerchant-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  elasticsearch-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  cardmerchant-network:
    driver: bridge