name: CD - Deploy to Docker Hub

on:
  push:
    branches: [ CI/CD ]  # Geçici - listelenmesi için
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to which environment?'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      
      docker_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: 🚀 Deployment Info
      run: |
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Tag: ${{ github.event.inputs.docker_tag }}"
        echo "By: ${{ github.actor }}"
        echo "Commit: ${{ github.sha }}"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./CardMerchantSystem.API/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/cardmerchant-api:${{ github.event.inputs.docker_tag }}
          ${{ secrets.DOCKER_USERNAME }}/cardmerchant-api:${{ github.event.inputs.environment }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cardmerchant-api:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cardmerchant-api:buildcache,mode=max
    
    - name: ✅ Deploy Summary
      run: |
        echo "Docker image pushed successfully!"
        echo ""
        echo "Image: ${{ secrets.DOCKER_USERNAME }}/cardmerchant-api:${{ github.event.inputs.docker_tag }}"
        echo ""
        echo "Pull command:"
        echo "docker pull ${{ secrets.DOCKER_USERNAME }}/cardmerchant-api:${{ github.event.inputs.docker_tag }}"