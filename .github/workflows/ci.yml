name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore
      run: dotnet restore CardMerchantSystem.sln
    
    - name: Build
      run: dotnet build CardMerchantSystem.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test CardMerchantSystem.sln --configuration Release --no-build --verbosity normal
